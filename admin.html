<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Campus Leave Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="brand-mark"><i class="fa-solid fa-user-shield"></i></div>
    <h1>Admin Sign In</h1>
    <p class="sub">Enter your credentials to access the leave applications dashboard.</p>

    <div class="login-alert" id="loginAlert">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span>Invalid Username or Password</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="field" style="margin-bottom: 16px;">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter admin username" autocomplete="username">
      </div>

      <div class="field" style="margin-bottom: 22px;">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
          <i class="fa-regular fa-eye toggle-eye" id="toggleEye"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
        <span id="loginBtnText"><i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard</span>
        <span class="spinner hidden" id="loginSpinner"></span>
      </button>
    </form>

    <p class="login-hint"><i class="fa-solid fa-circle-info"></i> Authorized personnel only. Default demo credentials are set in <code>admin.js</code>.</p>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
